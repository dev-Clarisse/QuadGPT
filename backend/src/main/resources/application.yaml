spring:
  application:
    name: backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

zai:
  api-key: ${ZAI_API_KEY}
  base-url: ${ZAI_BASE_URL:https://openrouter.ai/api/v1}
  model: ${ZAI_MODEL:deepseek/deepseek-v4-flash-0731:free}