spring:
  application:
    name: backend
  config:
    import: optional:file:.env[.properties]
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
  datasource:
    url: 'jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quadgpt}'
    username: '${DB_USER:quadgpt_user}'
    password: '${DB_PASSWORD:quadgpt}'

zai:
  api-key: '${ZAI_API_KEY}'
  base-url: '${ZAI_BASE_URL}'
  model: '${ZAI_MODEL}'

embedding:
  base-url: '${EMBEDDING_BASE_URL:http://localhost:11434}'
  model: '${EMBEDDING_MODEL:nomic-embed-text}'