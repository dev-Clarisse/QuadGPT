spring:
  application:
    name: backend

  config:
    import: optional:file:.env[.properties]

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    baseline-on-migrate: true

  datasource:
    url: 'jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quadgpt}'
    username: '${DB_USER:quadgpt_user}'
    password: '${DB_PASSWORD:quadgpt}'

zai:
  api-key: '${ZAI_API_KEY}'
  base-url: '${ZAI_BASE_URL}'
  model: '${ZAI_MODEL}'

embedding:
  base-url: '${EMBEDDING_BASE_URL:http://local-llm:11434}'
  model: '${EMBEDDING_MODEL:nomic-embed-text}'

app:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    department: ${ADMIN_DEPARTMENT}