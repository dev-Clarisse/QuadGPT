server {
    listen 80;
    server_name _;

    # Production frontend files generated by Vite are copied here
    # by the Dockerfile.
    root /usr/share/nginx/html;
    index index.html;

    # Forward backend API requests inside the Docker network.
    # The /api prefix is preserved when forwarding to Spring Boot.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        # Preserve useful request metadata for the backend.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React is a single-page application.
    # Unknown frontend routes must fall back to index.html so that
    # client-side routing can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}