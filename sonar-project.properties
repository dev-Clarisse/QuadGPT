# SonarCloud analysis of the whole repository (backend Java + frontend TypeScript).
# Run by the "SonarCloud" job of .github/workflows/ci-cd.yml.
# The two keys below are the defaults SonarCloud proposes when importing
# dev-Clarisse/QuadGPT: check them on sonarcloud.io > project > Information.
sonar.organization=projects-2880
sonar.projectKey=projects-2880_dev-clarisse-quadgpt
sonar.projectName=dev-Clarisse/QuadGPT

sonar.sourceEncoding=UTF-8

# Production code
sonar.sources=backend/src/main/java,backend/src/main/resources,frontend/src
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

# Test code (analysed as tests, not counted as production code)
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**,backend/src/test/java/**

# Java: compiled classes are needed for the analysis
sonar.java.source=17
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# Coverage: JaCoCo (unit + integration tests) and Vitest
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Not worth measuring: entry points, DTO records, JPA entities and configuration
sonar.coverage.exclusions=\
  backend/src/main/java/com/QuadGPT/backend/BackendApplication.java,\
  backend/src/main/java/com/QuadGPT/backend/**/dto/**,\
  backend/src/main/java/com/QuadGPT/backend/config/**,\
  frontend/src/main.tsx,\
  frontend/src/theme/**
