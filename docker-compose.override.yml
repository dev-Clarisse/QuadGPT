services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      # Vite development server exposed only on localhost.
      - "127.0.0.1:3001:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    labels:
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"